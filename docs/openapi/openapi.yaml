openapi: 3.1.0
info:
  title: SMSOne Enterprise API
  description: "Enterprise Spring Modulith template API. Every response uses the unified\
    \ envelope ({data | errors, meta, links}) with meta.requestId always present;\
    \ quote the requestId when reporting issues."
  contact:
    name: SMSOne
    email: david@smsone.co.ug
  version: "1"
servers:
- url: http://localhost:8080
  description: Local
- url: https://staging-api.smsone.co.ug
  description: Staging
- url: https://api.smsone.co.ug
  description: Production
security:
- bearerAuth: []
- keycloak: []
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      description: Paste a Keycloak-issued access token.
      scheme: bearer
      bearerFormat: JWT
    keycloak:
      type: oauth2
      description: Run the Keycloak authorization-code flow (PKCE).
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8081/realms/smsone/protocol/openid-connect/auth
          tokenUrl: http://localhost:8081/realms/smsone/protocol/openid-connect/token
          scopes:
            openid: OpenID Connect
            profile: Profile claims
