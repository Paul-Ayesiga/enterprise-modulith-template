components:
  schemas:
    UpsertTranslationRequest:
      type: object
      properties:
        value:
          type: string
          minLength: 1
      required:
      - value
    ResourceObject:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes: {}
    UpsertSettingRequest:
      type: object
      properties:
        value:
          type: string
          minLength: 1
        description:
          type: string
      required:
      - value
    UpdateWebhookRequest:
      type: object
      properties:
        url:
          type: string
          minLength: 1
        events:
          type: array
          items:
            type: string
            description: A subscribable event code — the vocabulary at GET /api/v1/webhooks/event-types
            enum:
            - org.member.added
            - org.member.removed
            - org.member.role_changed
            - org.role.permissions_changed
            - org.status_changed
            - org.deleted
            - org.subscription_changed
            - org.exchange.job_completed
          minItems: 1
          uniqueItems: true
        status:
          type: string
      required:
      - events
      - url
    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 0
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
          minItems: 1
          uniqueItems: true
      required:
      - name
      - permissions
    AssignRoleRequest:
      type: object
      properties:
        roleCode:
          type: string
          minLength: 1
      required:
      - roleCode
    ContactPayload:
      type: object
      properties:
        kind:
          type: string
        value:
          type: string
        label:
          type: string
        primary:
          type: boolean
    ProfilePayload:
      type: object
      properties:
        displayName:
          type: string
        phone:
          type: string
        timezone:
          type: string
        locale:
          type: string
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/ContactPayload"
    CurrentUser:
      type: object
      properties:
        subject:
          type: string
        username:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
          uniqueItems: true
        activeOrgAlias:
          type: string
        activeOrgId:
          type: string
          format: uuid
        impersonation:
          $ref: "#/components/schemas/Impersonation"
        impersonated:
          type: boolean
    Impersonation:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        actorSubject:
          type: string
    ToggleFeatureFlagRequest:
      type: object
      properties:
        enabled:
          type: boolean
        description:
          type: string
      required:
      - enabled
    AssignRequest:
      type: object
      properties:
        plan:
          type: string
    CreateOrganizationRequest:
      type: object
      properties:
        alias:
          type: string
          maxLength: 120
          minLength: 0
          pattern: "^[a-z0-9][a-z0-9-]{0,118}[a-z0-9]$"
        name:
          type: string
          maxLength: 200
          minLength: 0
        ownerEmail:
          type: string
          format: email
          minLength: 1
        ownerFirstName:
          type: string
        ownerLastName:
          type: string
      required:
      - alias
      - name
      - ownerEmail
    CreateWebhookRequest:
      type: object
      properties:
