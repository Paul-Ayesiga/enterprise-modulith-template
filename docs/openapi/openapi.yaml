      - Platform · Users & impersonation
      summary: List an operator's impersonation sessions
      description: "The caller's own sessions, live and historical, newest first.\
        \ `actor=<subject>` names another operator's instead and requires platform-admin.\
        \ `active` is computed when the row is read, so a lapsed session reports inactive\
