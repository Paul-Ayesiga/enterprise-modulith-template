                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WindowedResultResourceObject"
    post:
      tags:
      - Platform · Users & impersonation
      summary: Open an impersonation session
      description: "Defaults to a READ_ONLY session, which admits only GET, HEAD and\
        \ OPTIONS; `mode=WRITE` is refused unless the caller holds platform-admin.\
        \ `ttl` is an ISO-8601 duration bounded server-side — a request over the cap\
        \ is rejected, never silently clamped — and `reason` must be at least 8 characters.\
        \ Pass the returned id as the `X-Impersonate` header on the requests that\
        \ should run as the target."
