openapi: 3.1.0
info:
  title: SMSOne Enterprise API
  description: |-
    Enterprise Spring Modulith template API. Every response uses the unified envelope ({data | errors, meta, links}) with meta.requestId always present; quote the requestId when reporting issues.

    Operations are grouped as `<axis> · <resource>`. The axis is the authority the operation enforces — Platform (a realm role), Organization (a permission inside one tenant), Shared (any authenticated caller) — and it is read from the code that enforces it, so a group name cannot promise access the API will refuse.
  contact:
    name: SMSOne
    email: ayesigapo@gmail.com
  version: "1"
servers:
- url: http://localhost:8080
  description: Local
- url: https://staging-api.smsone.co.ug
  description: Staging
- url: https://api.smsone.co.ug
  description: Production
security:
- bearerAuth: []
- keycloak: []
tags:
- name: Platform · Users & impersonation
  description: "Identities across every tenant, and the impersonation sessions that\
    \ are the only sanctioned way from an operator to tenant data. platform-support\
    \ reads and may open a session; wearing an account that itself holds a platform\
    \ role needs platform-superadmin. A session carries no authority of its own, so\
    \ from inside one this whole group answers 403."
- name: Platform · Organizations
  description: "Creating a tenant, suspending it, reactivating it. These are platform\
    \ actions ON an organization, not actions inside one, and that is why they are\
    \ here: a fresh org has no member to hold a permission, and suspension cuts every\
    \ member's access — neither can be gated on a permission granted inside the org\
    \ being acted on. Reading and editing the record itself is the tenant's own business:\
    \ Organization · Profile."
- name: Platform · Settings & flags
  description: "Writing platform-wide configuration: setting values and feature-flag\
    \ state, platform-admin. The same keys are readable by any authenticated caller\
    \ under Shared · Settings & flags — same paths, different method, different authority,\
    \ which is why one controller lands in two groups."
- name: Platform · Billing & plans
  description: "The commercial axis of a tenant: the seeded plan catalogue and each\
    \ org's subscription. Reading is platform-support; assigning a plan is platform-admin,\
    \ audited, and bites the very next entitlement gate. A tenant reads its own state\
    \ under Organization · Profile's surface."
- name: Platform · Ops
  description: "Running the platform: scheduler lock state (proof that clustered jobs\
    \ fire once), the curated analytics reports, and the cross-tenant audit trail.\
    \ Read-only and platform-support throughout — investigating is the support job.\
    \ One tenant's own view of that trail is Organization · Audit."
- name: Organization · Profile
  description: "The organization record as its own members see it: read on org:read,\
    \ edit on org:update. Lifecycle is deliberately absent — that is Platform · Organizations."
- name: Organization · Members
  description: "Who belongs to one tenant and as what: list, invite, re-role, remove.\
    \ Handing someone a role IS granting its permissions, so invite and re-role are\
    \ additionally refused when they would grant more than the caller holds."
- name: Organization · Roles
  description: "A tenant's roles — named bundles of permission codes from the fixed\
    \ catalogue (Shared · Reference data). Role codes are inert: no request path resolves\
    \ authority from a code, only from the permission set. System roles refuse edits."
- name: Organization · Webhooks
  description: "One tenant's outbound event subscriptions and their delivery attempts,\
    \ all on webhook:manage. Endpoint URLs are SSRF-checked before they are stored,\
    \ and every delivery is signed and retried with backoff before it dead-letters."
- name: Organization · Audit
  description: "The audit trail scoped to one tenant, on audit:read — an org's own\
    \ admins can review their trail without any platform access. Rows written during\
    \ an impersonation session name the operator, not the account they wore."
- name: Organization · Exchange
  description: "Import and export as background jobs inside one tenant: submit answers\
    \ 202 and the work is polled, never awaited. Submitting is additionally refused\
    \ without the chosen handler's own permission — the handler is picked at runtime,\
    \ so no annotation can name that gate. Job metadata reads on org:read; the artifacts\
    \ (source, error report, result) answer only to the requester or a holder of that\
    \ same handler permission. The handler catalogue itself is Shared · Exchange catalog."
- name: Organization · Billing
  description: "The tenant's own money view — invoices, proxied from Kill Bill on\
    \ org:read. Plans, balances and billing actions are the platform's surface: Platform\
    \ · Billing & plans."
- name: Organization · Exchange schedules
  description: "Recurring exports on a cron (UTC), firing as their creator — whose\
    \ export permission is re-checked at every fire, so a revocation stops the schedule\
    \ loudly instead of letting it keep exporting. One-off jobs and their artifacts\
    \ are Organization · Exchange."
- name: Shared · Me & notifications
  description: "The caller's own identity and in-app notifications; no axis owns them\
    \ because a tenant member and a platform operator both legitimately arrive here.\
    \ GET /me is the one path the provisioning gate lets through for an un-provisioned\
    \ subject (onboarding), and still a hard stop for a disabled one."
- name: Shared · Files
  description: "Upload, download, delete, presign. The one group whose rule lives\
    \ in the handler rather than in an annotation, which is exactly why neither axis\
    \ claims it: your own namespace always, someone else's only with a platform tier\
    \ (support to read, admin to delete)."
- name: Shared · Settings & flags
  description: "Reading platform configuration — settings and feature-flag state are\
    \ visible to any authenticated caller, because how the application behaves is\
    \ not a secret. Writing them is Platform · Settings & flags."
- name: Shared · Reference data
  description: Fixed vocabularies any authenticated caller may read — today the permission
    catalogue that Organization · Roles is composed from. A new shared read lands
    here until it earns a group of its own.
- name: Shared · Exchange catalog
  description: "The exchange handler catalogue and its downloadable templates — which\
    \ datasets can move, what each file must look like, which permissions gate it.\
    \ Readable by any authenticated caller; running one is Organization · Exchange."
- name: Shared · My profile
  description: "The caller's own record — profile, contacts, preferences, avatar,\
    \ linked identity providers. No axis owns it: every row answers about YOU, whichever\
    \ axis you arrived from. Support's read-only view of a user's profile is Platform\
    \ · Users & impersonation."
- name: Shared · Webhook events
  description: "The subscribable webhook event vocabulary — the codes the subscription\
    \ endpoints' events array accepts, with what each means. Managing subscriptions\
    \ is Organization · Webhooks."
paths:
  /api/v1/translations/{locale}/{key}:
    get:
      tags:
      - Shared · Reference data
      summary: Get one translation
      operationId: get
      parameters:
      - name: locale
        in: path
        required: true
        schema:
          type: string
      - name: key
        in: path
        required: true
        schema:
          type: string
      - name: X-Impersonate
        in: header
        description: "Run this request as the target of an impersonation session (its\
          \ id, from POST /api/v1/admin/impersonations). The session must belong to\
          \ the calling operator; a READ_ONLY session refuses any unsafe method. Every\
          \ write is audited against the operator, not the target."
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id:
              description: "Public request id (accepted inbound, else minted as a\
                \ ULID)."
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResourceObject"
    put:
      tags:
      - Platform · Ops
      summary: Create or replace a translation
      description: "Upsert — a (locale, key) that does not exist yet is created. Locales\
        \ are BCP-47 tags, stored lowercased; an unparseable tag is a 422. The locale's\
        \ cached bundle is evicted cluster-wide, so resolution reflects the change\
        \ promptly."
      operationId: put
      parameters:
      - name: locale
        in: path
        required: true
        schema:
          type: string
      - name: key
        in: path
        required: true
        schema:
          type: string
      - name: X-Impersonate
        in: header
        description: "Run this request as the target of an impersonation session (its\
          \ id, from POST /api/v1/admin/impersonations). The session must belong to\
          \ the calling operator; a READ_ONLY session refuses any unsafe method. Every\
          \ write is audited against the operator, not the target."
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertTranslationRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id:
              description: "Public request id (accepted inbound, else minted as a\
                \ ULID)."
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResourceObject"
    delete:
      tags:
      - Platform · Ops
      summary: Delete a translation
      description: Resolution falls back down the chain (language → default → the
        key itself).
      operationId: delete
      parameters:
      - name: locale
        in: path
        required: true
        schema:
          type: string
      - name: key
        in: path
        required: true
        schema:
          type: string
      - name: X-Impersonate
        in: header
        description: "Run this request as the target of an impersonation session (its\
          \ id, from POST /api/v1/admin/impersonations). The session must belong to\
          \ the calling operator; a READ_ONLY session refuses any unsafe method. Every\
          \ write is audited against the operator, not the target."
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
          headers:
            X-Request-Id:
              description: "Public request id (accepted inbound, else minted as a\
                \ ULID)."
              schema:
                type: string
  /api/v1/settings/{key}:
    get:
      tags:
      - Shared · Settings & flags
      summary: Get one platform setting by key
      operationId: get_1
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      - name: X-Impersonate
        in: header
        description: "Run this request as the target of an impersonation session (its\
          \ id, from POST /api/v1/admin/impersonations). The session must belong to\
          \ the calling operator; a READ_ONLY session refuses any unsafe method. Every\
          \ write is audited against the operator, not the target."
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id:
              description: "Public request id (accepted inbound, else minted as a\
                \ ULID)."
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResourceObject"
    put:
      tags:
      - Platform · Settings & flags
      summary: Create or replace a platform setting
      description: "Upsert: a key that does not exist yet is created rather than rejected,\
        \ so there is no separate create call. Settings are global, not per-organization."
      operationId: put_1
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      - name: X-Impersonate
        in: header
        description: "Run this request as the target of an impersonation session (its\
          \ id, from POST /api/v1/admin/impersonations). The session must belong to\
          \ the calling operator; a READ_ONLY session refuses any unsafe method. Every\
          \ write is audited against the operator, not the target."
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertSettingRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id:
              description: "Public request id (accepted inbound, else minted as a\
                \ ULID)."
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResourceObject"
  /api/v1/orgs/{orgId}/webhooks/{id}:
    get:
      tags:
      - Organization · Webhooks
      summary: Get one webhook subscription
      description: The `secret` attribute is masked here — it is shown in full only
        at create.
      operationId: get_2
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Impersonate
        in: header
        description: "Run this request as the target of an impersonation session (its\
          \ id, from POST /api/v1/admin/impersonations). The session must belong to\
          \ the calling operator; a READ_ONLY session refuses any unsafe method. Every\
          \ write is audited against the operator, not the target."
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id:
              description: "Public request id (accepted inbound, else minted as a\
                \ ULID)."
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResourceObject"
    put:
      tags:
      - Organization · Webhooks
      summary: Update a webhook subscription
      description: "`url` and `events` are replaced wholesale, not merged. Omitting\
        \ `status` resets the subscription to ACTIVE, so a disabled subscription silently\
        \ resumes delivery unless the update repeats `status: DISABLED`. The signing\
        \ secret is never rotated here."
      operationId: update
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Impersonate
        in: header
        description: "Run this request as the target of an impersonation session (its\
          \ id, from POST /api/v1/admin/impersonations). The session must belong to\
          \ the calling operator; a READ_ONLY session refuses any unsafe method. Every\
          \ write is audited against the operator, not the target."
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWebhookRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id:
              description: "Public request id (accepted inbound, else minted as a\
                \ ULID)."
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResourceObject"
    delete:
      tags:
      - Organization · Webhooks
      summary: Delete a webhook subscription
      description: "Stops matching new events and cancels everything already queued\
        \ for the endpoint, so a revoked URL is not retried for hours. The delivery\
        \ log survives and stays readable — \"what did we send that endpoint?\" is\
        \ exactly the question asked after a delete."
      operationId: delete_1
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Impersonate
        in: header
        description: "Run this request as the target of an impersonation session (its\
          \ id, from POST /api/v1/admin/impersonations). The session must belong to\
          \ the calling operator; a READ_ONLY session refuses any unsafe method. Every\
          \ write is audited against the operator, not the target."
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
          headers:
            X-Request-Id:
              description: "Public request id (accepted inbound, else minted as a\
                \ ULID)."
              schema:
                type: string
  /api/v1/orgs/{orgId}/roles/{roleId}:
    get:
      tags:
      - Organization · Roles
      summary: Get one organization role
      operationId: get_3
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Impersonate
        in: header
        description: "Run this request as the target of an impersonation session (its\
          \ id, from POST /api/v1/admin/impersonations). The session must belong to\
          \ the calling operator; a READ_ONLY session refuses any unsafe method. Every\
          \ write is audited against the operator, not the target."
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id:
              description: "Public request id (accepted inbound, else minted as a\
                \ ULID)."
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResourceObject"
    put:
      tags:
      - Organization · Roles
      summary: Replace a role's name and permissions
      description: "`permissions` is replaced wholesale, not merged — omitting a code\
        \ revokes it from every member holding the role. The caller must already hold\
        \ every permission in the new set. The built-in `OWNER` role is immutable:\
        \ updating it is a 403. `code` cannot be changed."
      operationId: update_1
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Impersonate
        in: header
        description: "Run this request as the target of an impersonation session (its\
          \ id, from POST /api/v1/admin/impersonations). The session must belong to\
          \ the calling operator; a READ_ONLY session refuses any unsafe method. Every\
          \ write is audited against the operator, not the target."
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id:
              description: "Public request id (accepted inbound, else minted as a\
                \ ULID)."
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResourceObject"
    delete:
      tags:
      - Organization · Roles
      summary: Delete a custom organization role
      description: A role still assigned to any member is a 409 — reassign them first.
        The built-in `OWNER` role cannot be deleted at all (403).
      operationId: delete_2
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Impersonate
        in: header
        description: "Run this request as the target of an impersonation session (its\
          \ id, from POST /api/v1/admin/impersonations). The session must belong to\
          \ the calling operator; a READ_ONLY session refuses any unsafe method. Every\
          \ write is audited against the operator, not the target."
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
          headers:
            X-Request-Id:
              description: "Public request id (accepted inbound, else minted as a\
                \ ULID)."
              schema:
                type: string
  /api/v1/orgs/{orgId}/members/{subject}/role:
    put:
      tags:
      - Organization · Members
      summary: Reassign a member's role
      description: "Last-owner protected: demoting the only remaining OWNER is a 409,\
        \ because it would lock the organization out of its own administration. The\
        \ caller must already hold every permission the new role carries, so this\
        \ endpoint alone cannot escalate. Assigning the role the member already has\
        \ is a no-op."
      operationId: assignRole
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: subject
        in: path
        required: true
        schema:
          type: string
      - name: X-Impersonate
        in: header
        description: "Run this request as the target of an impersonation session (its\
          \ id, from POST /api/v1/admin/impersonations). The session must belong to\
          \ the calling operator; a READ_ONLY session refuses any unsafe method. Every\
          \ write is audited against the operator, not the target."
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRoleRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id:
              description: "Public request id (accepted inbound, else minted as a\
                \ ULID)."
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResourceObject"
  /api/v1/me/profile:
    get:
      tags:
      - Shared · My profile
      summary: Read your profile
      description: "A user who never saved one still HAS one — empty fields, no 404."
      operationId: profile
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      - name: X-Impersonate
        in: header
        description: "Run this request as the target of an impersonation session (its\
          \ id, from POST /api/v1/admin/impersonations). The session must belong to\
          \ the calling operator; a READ_ONLY session refuses any unsafe method. Every\
          \ write is audited against the operator, not the target."
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id:
              description: "Public request id (accepted inbound, else minted as a\
                \ ULID)."
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResourceObject"
    put:
      tags:
      - Shared · My profile
      summary: Update your profile
      description: Whole-document upsert; `contacts` replaces the contact list (kind
        EMAIL | PHONE | OTHER).
      operationId: update_2
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      - name: X-Impersonate
        in: header
        description: "Run this request as the target of an impersonation session (its\
          \ id, from POST /api/v1/admin/impersonations). The session must belong to\
          \ the calling operator; a READ_ONLY session refuses any unsafe method. Every\
          \ write is audited against the operator, not the target."
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePayload"
        required: true
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id:
              description: "Public request id (accepted inbound, else minted as a\
                \ ULID)."
              schema:
                type: string
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResourceObject"
  /api/v1/me/preferences:
    get:
      tags:
      - Shared · My profile
      summary: Read your preferences (small key/value pairs)
      operationId: preferences
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      - name: X-Impersonate
        in: header
        description: "Run this request as the target of an impersonation session (its\
          \ id, from POST /api/v1/admin/impersonations). The session must belong to\
          \ the calling operator; a READ_ONLY session refuses any unsafe method. Every\
          \ write is audited against the operator, not the target."
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id:
              description: "Public request id (accepted inbound, else minted as a\
                \ ULID)."
              schema:
                type: string
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
    put:
      tags:
      - Shared · My profile
      summary: Update preferences additively
      description: Only the sent keys change; a null value deletes its key.
      operationId: putPreferences
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      - name: X-Impersonate
        in: header
        description: "Run this request as the target of an impersonation session (its\
          \ id, from POST /api/v1/admin/impersonations). The session must belong to\
          \ the calling operator; a READ_ONLY session refuses any unsafe method. Every\
          \ write is audited against the operator, not the target."
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
        required: true
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id:
              description: "Public request id (accepted inbound, else minted as a\
                \ ULID)."
              schema:
                type: string
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/v1/feature-flags/{key}:
    get:
      tags:
      - Shared · Settings & flags
      summary: Get one feature flag by key
      operationId: get_4
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      - name: X-Impersonate
