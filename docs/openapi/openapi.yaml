                $ref: "#/components/schemas/ResourceObject"
  /api/v1/files/presign:
    post:
      tags:
      - Shared · Files
      summary: Mint a presigned upload or download URL
      description: "`operation: PUT` always mints a NEW key under the caller's own\
        \ namespace — the supplied `key` is treated as a filename hint, never as a\
        \ target, so a presigned upload can never replace an existing object. `operation:\
        \ GET` presigns the existing `key`, which must be given. Both URLs are short-lived;\
        \ `expiresInSeconds` states how long."
      operationId: presign
      parameters:
      - name: user
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      - name: X-Impersonate
        in: header
