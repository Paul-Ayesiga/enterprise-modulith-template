name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Modulith + gateway suites. Testcontainers (Postgres, Keycloak, SeaweedFS…) runs on the
  # runner's Docker daemon — no service containers to declare; the tests own their infra.
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Modulith tests (incl. ModularityTests + contract tests)
        run: ./gradlew :test
      - name: Gateway tests
        run: ./gradlew :gateway:app:test
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests
            gateway/app/build/reports/tests
          retention-days: 7

  portal-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        portal: [developer-portal, admin-portal]
    defaults:
      run:
        working-directory: web/gateway/${{ matrix.portal }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/gateway/${{ matrix.portal }}/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  # Supply chain: an SBOM of what we ship (kept as a build artifact — the ingredient list an
  # auditor or a CVE fire drill starts from) and a vulnerability scan that FAILS on known-fixed
  # CRITICALs. HIGHs are reported, not blocking — tighten once the baseline is clean.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SBOM (CycloneDX, via syft)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 30
      - name: Vulnerability scan (trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint + render the chart
        run: |
          helm lint deploy/helm/smsone
          helm template smoke deploy/helm/smsone >/dev/null

  # Images on every main push: Boot buildpacks for the JVM apps (no Dockerfiles to maintain),
  # the portals from their Dockerfiles. Tags: the commit SHA (immutable — what Helm deploys pin)
  # plus a moving `main`.
  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-tests, portal-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_BASE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push JVM images (buildpacks)
        run: |
          ./gradlew bootBuildImage --imageName "$IMAGE_BASE/modulith:${GITHUB_SHA}" --publishImage
          ./gradlew :gateway:app:bootBuildImage --imageName "$IMAGE_BASE/gateway:${GITHUB_SHA}" --publishImage
      - name: Build and push portal images
        run: |
          for portal in developer-portal admin-portal; do
            docker build -t "$IMAGE_BASE/$portal:${GITHUB_SHA}" "web/gateway/$portal"
            docker push "$IMAGE_BASE/$portal:${GITHUB_SHA}"
          done
      - name: Move the main tags
        run: |
          for image in modulith gateway developer-portal admin-portal; do
            docker pull "$IMAGE_BASE/$image:${GITHUB_SHA}"
            docker tag "$IMAGE_BASE/$image:${GITHUB_SHA}" "$IMAGE_BASE/$image:main"
            docker push "$IMAGE_BASE/$image:main"
          done

  # GitOps deploy (pull-based, no cluster creds in CI). On every push to main, record the freshly built
  # image SHA in the prod values file and commit it; a prod Argo CD Application (deploy/argocd/application.yaml)
  # watching deploy/helm/smsone on `main` then rolls it out — zero-downtime. See
  # docs/cicd-gitops-and-cluster.html. Needs the Actions bot allowed to push to main; otherwise the push is a
  # no-op with a warning (nothing else breaks).
  gitops-bump:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Record the deployed image tag and commit it
        run: |
          f=deploy/helm/smsone/values-prod.yaml
          sed -i -E "s|^(  imageTag: ).*# gitops-bump.*$|\1${GITHUB_SHA} # gitops-bump: CI overwrites this with the built commit SHA|" "$f"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          if git diff --cached --quiet; then echo "image tag unchanged — nothing to deploy"; exit 0; fi
          git commit -m "chore(gitops): deploy ${GITHUB_SHA} [skip ci]"
          git push || echo "::warning::Could not push the GitOps bump — allow the github-actions bot to push to main (branch protection)."
