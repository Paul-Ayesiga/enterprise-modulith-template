# SMSOne copy overrides for Keycloak's stock messages.
#
# The stock "Account updated / « Back to Application" page appears after a
# required action completes (e.g. a newly-invited resident sets their first
# password). "Back to Application" reads like a dead end — spell out the
# actual next step instead.
accountUpdatedMessage=Your account is ready. Continue to the sign-in page and log in with your new password.
accountUpdatedTitle=Account updated
backToApplication=Continue to sign in »
proceedWithAction=» Continue

