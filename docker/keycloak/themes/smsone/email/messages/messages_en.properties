# SMSOne email-template message overrides.
# Stock Keycloak ones land via parent=base in theme.properties; we only
# override the strings the resident-facing emails read so they don't say
# "Account Action Required" or "Account already exists".

# Subject of the invitation email (executeActions.ftl). Default Keycloak
# value is "Update Your Account" — too generic. New copy frames it as a
# welcome so the resident knows what the email actually is.
executeActionsSubject=Welcome to SMSOne — set up your portal

# Subject of the email-verification email (used if VERIFY_EMAIL ever
# fires standalone, e.g. password reset on an unverified account).
emailVerificationSubject=Verify your SMSOne email
