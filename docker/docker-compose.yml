name: enterprise-modulith-template

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modulith}
      POSTGRES_USER: ${POSTGRES_USER:-modulith}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modulith}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18 images keep PGDATA under /var/lib/postgresql — mount the parent, not /data
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-modulith} -d ${POSTGRES_DB:-modulith}"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  valkey:
    image: valkey/valkey:8-alpine
    labels:
      org.springframework.boot.service-connection: redis
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.40
    command: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3-config.json", "-dir=/data"]
    ports:
      - "${S3_PORT:-8333}:8333"                    # S3 API
      - "${SEAWEED_FILER_PORT:-8888}:8888"         # Filer web UI — browse objects under /buckets/<bucket>
      - "${SEAWEED_MASTER_PORT:-9333}:9333"        # Master web UI — cluster status/topology
    volumes:
      - ./seaweedfs/s3-config.json:/etc/seaweedfs/s3-config.json:ro
      - seaweedfs-data:/data

  mailpit:
    image: axllent/mailpit:v1.30.2
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"  # Web UI
      - "${SMTP_PORT:-1025}:1025"        # SMTP sink

  otel-lgtm:
    image: grafana/otel-lgtm:0.28.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"   # Grafana UI
      - "${OTLP_GRPC_PORT:-4317}:4317" # OTLP gRPC
      - "${OTLP_HTTP_PORT:-4318}:4318" # OTLP HTTP

volumes:
  postgres-data:
  seaweedfs-data:
  valkey-data:
