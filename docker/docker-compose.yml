name: enterprise-modulith-template

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modulith}
      POSTGRES_USER: ${POSTGRES_USER:-modulith}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modulith}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18 images keep PGDATA under /var/lib/postgresql — mount the parent, not /data
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-modulith} -d ${POSTGRES_DB:-modulith}"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    # The --spi-theme-* flags disable theme caching so edits under docker/keycloak/themes
    # show on refresh (dev loop); production serves themes cached.
    command: ["start-dev", "--import-realm",
              "--spi-theme-static-max-age=-1", "--spi-theme-cache-themes=false", "--spi-theme-cache-templates=false"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Substituted into realm-smsone.json's displayName at import — the brand name the
      # smsone login/email theme renders everywhere (realm.displayName / realmName).
      BRAND_NAME: ${BRAND_NAME:-SMSONE}
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro

  valkey:
    image: valkey/valkey:8-alpine
    labels:
      org.springframework.boot.service-connection: redis
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.40
    command: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3-config.json", "-dir=/data"]
    ports:
      - "${S3_PORT:-8333}:8333"                    # S3 API
      - "${SEAWEED_FILER_PORT:-8888}:8888"         # Filer web UI — browse objects under /buckets/<bucket>
      - "${SEAWEED_MASTER_PORT:-9333}:9333"        # Master web UI — cluster status/topology
    volumes:
      - ./seaweedfs/s3-config.json:/etc/seaweedfs/s3-config.json:ro
      - seaweedfs-data:/data

  mailpit:
    image: axllent/mailpit:v1.30.2
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"  # Web UI
      - "${SMTP_PORT:-1025}:1025"        # SMTP sink

  killbill-db:
    image: killbill/mariadb:0.24
    environment:
      - MYSQL_ROOT_PASSWORD=killbill
    volumes:
      - killbill-db-data:/var/lib/mysql

  killbill:
    image: killbill/killbill:0.24.10
    depends_on:
      - killbill-db
    ports:
      - "${KILLBILL_PORT:-8082}:8080"   # 8080/8081 are taken by the app and Keycloak
    environment:
      - KILLBILL_DAO_URL=jdbc:mysql://killbill-db:3306/killbill
      - KILLBILL_DAO_USER=root
      - KILLBILL_DAO_PASSWORD=killbill
      # Test mode enables the simple-plan catalog endpoint the dev bootstrap uses.
      - KILLBILL_SERVER_TEST_MODE=true

  kaui:
    image: killbill/kaui:3.0.5
    depends_on:
      - killbill
    ports:
      - "${KAUI_PORT:-9095}:8080"       # Kill Bill admin UI (login admin/password)
    environment:
      - KAUI_CONFIG_DAO_URL=jdbc:mysql://killbill-db:3306/kaui
      - KAUI_CONFIG_DAO_USER=root
      - KAUI_CONFIG_DAO_PASSWORD=killbill
      - KAUI_KILLBILL_URL=http://killbill:8080
      # Kaui 3.x is Rails 7 running in 'production', which aborts on boot without a secret_key_base
      # (it signs the admin UI's session cookies). A dev default is baked in so `make run` just works;
      # override per-machine with KAUI_SECRET_KEY_BASE in docker/.env — generate one with `openssl rand -hex 64`.
      - SECRET_KEY_BASE=${KAUI_SECRET_KEY_BASE:-e50f45d81c557432df35f9c8f094070473dac79805ebc26729796ea3b322f6d08aeb57d3a269935e97c6e7912078c1e96902b93ac4f2f3d66437a2f11eaa52e5}
      # Point Kaui at the same KB tenant the app bootstraps (BILLING_BOOTSTRAP), reading the very vars
      # the app reads — so the UI opens on that tenant's accounts/invoices, not an empty login.
      - KAUI_KILLBILL_API_KEY=${KILLBILL_API_KEY:-smsone}
      - KAUI_KILLBILL_API_SECRET=${KILLBILL_API_SECRET:-smsone-secret}

  otel-lgtm:
    image: grafana/otel-lgtm:0.28.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"   # Grafana UI
      - "${OTLP_GRPC_PORT:-4317}:4317" # OTLP gRPC
      - "${OTLP_HTTP_PORT:-4318}:4318" # OTLP HTTP
    volumes:
      # File-provisioned SMSOne dashboards (folder "SMSOne" in the UI) — see docker/grafana/README.md
      - ./grafana/provisioning-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/smsone.yaml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards/smsone:ro
      # Alerts-as-code (folder "SMSOne"): thresholds live in git; each rule links its runbook.
      - ./grafana/provisioning-alerts.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/smsone.yaml:ro

volumes:
  postgres-data:
  seaweedfs-data:
  valkey-data:
  killbill-db-data:
