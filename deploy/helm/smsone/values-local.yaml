# Local k3s (Ubuntu/UTM, arm64) overrides for the smsone chart. The chart is STATE-EXTERNAL by design;
# here we point it at the in-cluster state stood up by deploy/k3s-local/infra/* and run the app images
# built on the Mac and imported into containerd (imagePullPolicy: Never — no registry in this loop).
#
#   helm upgrade --install smsone deploy/helm/smsone -n smsone -f deploy/helm/smsone/values-local.yaml
#
# The issuer crux (docs/plans/K8S_LOCAL_PLAN.md §5): every token's `iss` is http://auth.smsone.local/realms/smsone;
# a coredns-custom rewrite makes that host resolve IN-cluster to the keycloak Service, so the modulith
# (issuerUri = same host) and the gateway (JWKS = same host) validate the very tokens the browser mints.

global:
  imageBase: smsone            # images are smsone/modulith:dev and smsone/gateway:dev (ctr-imported)
  imageTag: dev
  imagePullPolicy: Never       # use the containerd-local image; never reach for a registry

# In-cluster state (deploy/k3s-local/infra) — Services, not the chart's example endpoints.
postgres:
  host: postgres
  port: 5432
  database: modulith
valkey:
  host: valkey
seaweedfs:
  s3Endpoint: http://seaweedfs:8333
killbill:
  url: http://localhost:8082   # Kill Bill is not deployed locally; the app only dials it lazily
smtp:
  host: localhost              # no mail server locally; mail is sent lazily, never at boot

# The chart's Keycloak is prod-mode (start --optimized, no import). Locally we run the dev-Keycloak from
# deploy/k3s-local/infra/keycloak.yaml (start-dev --import-realm, owns the `keycloak` Service + auth ingress).
keycloak:
  enabled: false

modulith:
  # 1 locally: each replica costs ~750 MB and the 8 GB VM had only ~2 GB free — less than a Jenkins build
  # agent needs (1.4 GB Gradle + 0.5 GB dind), so CI could schedule a build pod but would drive the node
  # into memory pressure. Rolling updates still surge a new pod before retiring the old one, so upgrades
  # stay zero-downtime; what you give up is redundancy against a crash and anything for the gateway to
  # round-robin across. Raise it temporarily to re-run the multi-replica or 3->5->3 scale demos.
  replicas: 1
  # Same host the browser uses; resolves in-cluster to keycloak via the coredns-custom rewrite.
  issuerUri: http://auth.smsone.local/realms/smsone
  # The admin client's Keycloak base URL — our dev-Keycloak Service via the issuer host (not the
  # chart's {release}-keycloak default, which we don't deploy locally).
  keycloakUrl: http://auth.smsone.local
  env:
    - { name: OTEL_SDK_DISABLED, value: "true" }
    # No OTLP collector locally — stop the 1-minute push to localhost:4318 (and its shutdown stack trace).
    - { name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED, value: "false" }
    - { name: SIGNUP_ENABLED, value: "true" }
    # Provision the demo identity at startup. Both default OFF in the chart (and so in prod); they are
    # on here because a freshly built local cluster is otherwise in a state that reads as broken but is
    # working as designed: Keycloak's realm import creates `paul`, so he authenticates perfectly, and
    # the platform admits nobody — no-JIT provisioning means a valid JWT is not access, and the `person`
    # row has to come from somewhere. Locally this is that somewhere. Both are idempotent and both need
    # Keycloak reachable; neither ever creates a Keycloak account.
    #
    # The two do different halves and a demo wants both:
    #   IDENTITY_* projects the person + external_identity link for an EXISTING account, which is what
    #             gets a realm-imported platform admin past the gate WITHOUT owning any org;
    #   ORG_*     seeds the `acme` tenant and makes that person its OWNER, which is what makes org RBAC
    #             exercisable at all — platform roles and org permissions are disjoint axes.
    # Their default e-mails already agree with the realm's `paul` (ayesigapo@gmail.com), which is what
    # makes them resolve to the same person rather than creating two.
    - { name: IDENTITY_DEV_BOOTSTRAP_ENABLED, value: "true" }
    - { name: ORG_DEV_BOOTSTRAP_ENABLED, value: "true" }
  resources:
    requests: { cpu: 250m, memory: 448Mi }
    limits: { memory: 1024Mi }

gateway:
  replicas: 1
  env:
    - { name: OTEL_SDK_DISABLED, value: "true" }
    - { name: JAVA_OPTS, value: "-Xms128m -Xmx256m -XX:+UseSerialGC" }
  resources:
    requests: { cpu: 150m, memory: 256Mi }
    limits: { memory: 512Mi }

# The pre-upgrade migration Job. Kept ENABLED — it is what builds `tenant_pool` at all, so a local
# cluster without it comes up with the platform schema and pods that fail their post-ready schema check.
# Trimmed like everything else here: the fleet is one schema on an 8 GB VM, so two workers and a small
# heap. It runs before the app pods and exits, so it never competes with them for the node's memory.
tenantMigration:
  workers: 2
  javaOpts: "-Xms64m -Xmx256m -XX:+UseSerialGC"
  resources:
    requests: { cpu: 150m, memory: 192Mi }
    limits: { memory: 384Mi }

# The two Next.js portals are deferred locally (K8S_LOCAL_PLAN §8) — no images in this loop.
developerPortal:
  enabled: false
adminPortal:
  enabled: false

# No nightly pg_dump CronJob locally.
backup:
  enabled: false

ingress:
  className: traefik
  hosts:
    api: api.smsone.local        # → gateway (the edge). auth host is owned by the infra dev-Keycloak.
    auth: auth.smsone.local
    portal: portal.smsone.local
    admin: admin.smsone.local
