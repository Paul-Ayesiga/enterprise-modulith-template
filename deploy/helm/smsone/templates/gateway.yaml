{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    {{- include "smsone.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        {{- include "smsone.labels" . | nindent 8 }}
    spec:
      containers:
        - name: gateway
          image: {{ include "smsone.image" (dict "root" . "name" "gateway") }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.gateway.port }}
            # Admin/management port — cluster-internal ONLY; the Service below does not expose it.
            - containerPort: {{ .Values.gateway.adminPort }}
          env:
            - { name: BACKEND_URI, value: "http://modulith:8080" }
            - { name: GATEWAY_REDIS_HOST, value: {{ .Values.valkey.host | quote }} }
            - { name: GATEWAY_JWKS_URI, value: {{ printf "%s/protocol/openid-connect/certs" .Values.modulith.issuerUri | quote }} }
            - name: GATEWAY_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.credentials.secretName }}, key: gateway-admin-token, optional: true } }
            {{- with .Values.gateway.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /actuator/health, port: {{ .Values.gateway.adminPort }} }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: {{ .Values.gateway.adminPort }} }
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "smsone.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - port: 8080
      targetPort: {{ .Values.gateway.port }}
{{- end }}
