{{- range $portal := list "developerPortal" "adminPortal" }}
{{- $cfg := index $.Values $portal }}
{{- if $cfg.enabled }}
{{- $name := ternary "developer-portal" "admin-portal" (eq $portal "developerPortal") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "smsone.labels" $ | nindent 4 }}
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        {{- include "smsone.labels" $ | nindent 8 }}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ include "smsone.image" (dict "root" $ "name" $name) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: 3000
          env:
            - { name: PORT, value: "3000" }
            # The portals talk to the platform through the edge, and log in at the public issuer.
            - { name: NEXT_PUBLIC_API_BASE, value: {{ printf "https://%s" $.Values.ingress.hosts.api | quote }} }
            - { name: NEXT_PUBLIC_KEYCLOAK_URL, value: {{ printf "https://%s" $.Values.ingress.hosts.auth | quote }} }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "smsone.labels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - port: 3000
      targetPort: 3000
---
{{- end }}
{{- end }}
