# Jenkins controller on the local k3s cluster — self-hosted CI (no GitHub-hosted minutes). The controller
# runs here; build work runs in on-demand agent pods spawned by the Kubernetes plugin (see the Jenkinsfile).
# Browse http://jenkins.smsone.local (add to the Mac's /etc/hosts) or port-forward svc/jenkins 8080:8080.
#
# There is no setup wizard: plugins come from plugins.txt (installed by an initContainer) and the entire
# controller config — admin user, Kubernetes cloud, credentials, the pipeline job — comes from jcasc.yaml.
# The wizard is a one-shot, click-through, unversioned state machine that leaves nothing behind in Git, and
# it strands the controller with zero plugins if its plugin download is ever interrupted.
#
# APPLY WITH scripts/k3s-jenkins.sh, not `kubectl apply -f` on its own: the script builds the ConfigMap from
# plugins.txt + jcasc.yaml and creates the `jenkins-secrets` Secret this Deployment reads.
#
# NOTE (RAM): the controller is light (~0.9 GB with these plugins); real builds (Gradle + Testcontainers, or
# bootBuildImage) need ~1.5–2 GB in an agent pod — tight on an 8 GB VM alongside the app + Argo. Bump the VM
# or use an external/beefier agent for heavy builds.
apiVersion: v1
kind: Namespace
metadata:
  name: jenkins
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: jenkins
---
# The Kubernetes plugin needs to create/manage agent pods in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-agents
  namespace: jenkins
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/log"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-agents
  namespace: jenkins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-agents
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-home
  namespace: jenkins
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 6Gi
---
# Gradle's dependency cache, kept OUT of the agent pod so it survives between builds. Agent pods are
# ephemeral, so without this every build re-downloads the whole dependency graph plus the Gradle
# distribution over the VM's uplink — which is how builds #10 and #15 died (a JRE tarball and a handful
# of Maven Central jars, both "Read timed out"). Nothing about the build needed to change; it just had to
# stop fetching the internet twice an hour.
#
# ReadWriteOnce is fine because the Jenkinsfile sets disableConcurrentBuilds(), so only one agent ever
# mounts it. Delete the PVC to force a cold rebuild.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-gradle-cache
  namespace: jenkins
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
# dind's /var/lib/docker, kept across builds. The Gradle cache PVC above stopped Java dependencies being
# re-fetched, but it does not touch anything Docker-side: the Paketo builder image (~1 GB+), the run
# image, and the buildpack cache volumes holding the BellSoft JRE all lived in the agent pod's ephemeral
# storage and were re-pulled every single build. That download is what failed build #10.
#
# CAUTION: local-path does NOT enforce the size below — it is a directory on the node, so a runaway dind
# can fill the VM disk and take the cluster with it (DiskPressure evicts everything). The VM had ~9.8 GB
# free when this was added, hence the modest request; the pipeline also prunes dangling images after each
# image build. Check with `df -h /` on the VM, and delete this PVC to reset Docker state entirely.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-dind-cache
  namespace: jenkins
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 6Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
spec:
  replicas: 1
  strategy:
    type: Recreate            # single RWO PVC
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      serviceAccountName: jenkins
      securityContext:
        runAsUser: 1000
        fsGroup: 1000          # own /var/jenkins_home on the PVC
      initContainers:
        # Installs plugins.txt into the PVC before the controller starts, so Jenkins boots with every plugin
        # already present and never has to talk to the update centre interactively. Re-runs only when
        # plugins.txt changes: the checksum marker keeps ordinary pod restarts from re-downloading the whole
        # set (~80 jpi once dependencies are resolved), and from needing the network at all.
        - name: install-plugins
          image: jenkins/jenkins:lts-jdk21
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              want="$(md5sum /config/plugins.txt | cut -d' ' -f1)"
              marker=/var/jenkins_home/.plugins-installed
              if [ -f "$marker" ] && [ "$(cat "$marker")" = "$want" ]; then
                echo "plugins already match plugins.txt ($want) — skipping download"
                exit 0
              fi
              echo "installing plugins from plugins.txt ($want)"
              jenkins-plugin-cli \
                --plugin-file /config/plugins.txt \
                --plugin-download-directory /var/jenkins_home/plugins \
                --latest true
              echo "$want" > "$marker"
          volumeMounts:
            - { name: home, mountPath: /var/jenkins_home }
            - { name: config, mountPath: /config }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 768Mi }
      containers:
        - name: jenkins
          image: jenkins/jenkins:lts-jdk21
          env:
            # runSetupWizard=false is the point of all this — JCasC owns the config instead.
            # MaxMetaspaceSize is bounded on purpose: ~80 plugins push metaspace hard, and left unbounded it
            # grows past the container limit and the pod is OOMKilled rather than throwing a JVM error.
            - name: JAVA_OPTS
              value: >-
                -Djenkins.install.runSetupWizard=false
                -Xmx768m
                -XX:MaxMetaspaceSize=300m
            - name: CASC_JENKINS_CONFIG
              value: /config/jcasc.yaml
          envFrom:
            # Admin password + the ghcr / git-push credential values that jcasc.yaml interpolates.
            - secretRef:
                name: jenkins-secrets
          ports:
            - { containerPort: 8080, name: http }
            - { containerPort: 50000, name: agent }
          volumeMounts:
            - { name: home, mountPath: /var/jenkins_home }
            - { name: config, mountPath: /config }
          readinessProbe:
            httpGet: { path: /login, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 1400Mi }
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: jenkins-home
        - name: config
          configMap:
            name: jenkins-config     # built from plugins.txt + jcasc.yaml by scripts/k3s-jenkins.sh
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: jenkins
spec:
  selector:
    app: jenkins
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
    - { name: agent, port: 50000, targetPort: 50000 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jenkins
  namespace: jenkins
spec:
  ingressClassName: traefik
  rules:
    - host: jenkins.smsone.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jenkins
                port:
                  number: 8080
