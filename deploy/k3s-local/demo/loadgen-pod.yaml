apiVersion: v1
kind: Pod
metadata:
  name: loadgen
  namespace: smsone
  labels: { app: loadgen }
spec:
  restartPolicy: Never
  enableServiceLinks: false
  containers:
    - name: loadgen
      image: smsone/gateway:dev          # reuse an image already in containerd (has curl + sh)
      imagePullPolicy: Never
      command: ["sh", "/s/loadgen.sh"]
      env:
        - { name: DURATION, value: "300" }
        - { name: GAP, value: "0.3" }
      volumeMounts:
        - { name: script, mountPath: /s }
  volumes:
    - name: script
      configMap: { name: loadgen-script }
