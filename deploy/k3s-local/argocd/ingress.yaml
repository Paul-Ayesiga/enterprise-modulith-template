# Browse the Argo CD UI at http://argocd.smsone.local (add that host to the Mac's /etc/hosts -> VM IP,
# alongside api/auth). argocd-server runs in insecure/HTTP mode (server.insecure=true in
# argocd-cmd-params-cm), so Traefik routes plain HTTP to its :80 service port. Alternative without
# /etc/hosts: `kubectl -n argocd port-forward svc/argocd-server 8080:80` on the MAC, then localhost:8080.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
spec:
  ingressClassName: traefik
  rules:
    - host: argocd.smsone.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
