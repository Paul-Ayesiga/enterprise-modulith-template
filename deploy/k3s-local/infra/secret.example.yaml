# TEMPLATE ONLY — copy to secret.yaml, fill real values, and apply it yourself. Never commit the
# filled copy (secret.yaml is gitignored). scripts/k3s-up.sh creates this Secret for you from dev
# defaults; this file documents the exact keys for when you want to manage it by hand.
#
#   cp secret.example.yaml secret.yaml && $EDITOR secret.yaml && kubectl apply -f secret.yaml
#
# Two key styles live here on purpose:
#   * UPPER_SNAKE  — read by the in-cluster INFRA pods (postgres, keycloak) in state.yaml/keycloak.yaml.
#   * kebab-case   — read by the Helm CHART (modulith, gateway) via credentials.secretName.
apiVersion: v1
kind: Secret
metadata:
  name: smsone-credentials
  namespace: smsone
type: Opaque
stringData:
  # --- infra pods ---
  POSTGRES_PASSWORD: "modulith"          # postgres superuser + Keycloak's DB password
  KEYCLOAK_ADMIN_PASSWORD: "admin"       # Keycloak bootstrap admin
  GATEWAY_SECRET: "dev-gateway-secret"   # kept for parity; the chart reads gateway-secret below
  # --- Helm chart (modulith / gateway) ---
  postgres-user: "modulith"
  postgres-password: "modulith"
  killbill-user: "admin"                 # Kill Bill not deployed locally; placeholder
  killbill-password: "password"
  gateway-secret: "dev-gateway-secret"   # MUST match on both the gateway and the modulith
