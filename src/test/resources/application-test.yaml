# Test profile: no telemetry export — tests must not depend on a running OTLP collector.
# Bucket bootstrap off by default; the files IT re-enables it against its SeaweedFS container.
app:
  storage:
    bootstrap-bucket: false
  # keep DuckDB artifacts inside the build dir
  analytics:
    database-path: build/test-analytics/analytics.duckdb
    snapshot-dir: build/test-analytics/snapshots
  # L1-only in tests; the Valkey IT re-enables L2 against its own container.
  cache:
    l2-enabled: false


management:
  otlp:
    metrics:
      export:
        enabled: false
    tracing:
      export:
        enabled: false
    logging:
      export:
        enabled: false
