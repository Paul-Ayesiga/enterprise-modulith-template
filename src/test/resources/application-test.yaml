# Test profile: no telemetry export — tests must not depend on a running OTLP collector.
# Bucket bootstrap off by default; the files IT re-enables it against its SeaweedFS container.
spring:
  datasource:
    hikari:
      # The suite keeps many cached Spring contexts alive against one Postgres container; a large
      # pool per context exhausts max_connections ("too many clients already"). Keep it small — 3
      # covers a request thread + an async @ApplicationModuleListener needing its own connection.
      maximum-pool-size: 3
      minimum-idle: 1

app:
  storage:
    bootstrap-bucket: false
  # keep DuckDB artifacts inside the build dir
  analytics:
    database-path: build/test-analytics/analytics.duckdb
    snapshot-dir: build/test-analytics/snapshots
  # L1-only in tests; the Valkey IT re-enables L2 against its own container.
  cache:
    l2-enabled: false
  # Rate limiting needs Valkey; off by default in tests. The rate-limit IT re-enables it against
  # its own Valkey container.
  rate-limit:
    enabled: false
  # No-JIT provisioning gate off by default (existing API tests use jwt() mocks with no User row);
  # the identity IT re-enables it and provisions users to exercise the gate.
  provisioning:
    gate-enabled: false
  # A promotion settles for two seconds in production so requests already in flight can finish.
  # Nothing here has in-flight requests, and eight promotions across the promotion tests would spend
  # sixteen seconds of the suite asleep. Shortened, not removed: the wait is still taken, so the
  # ordering it enforces is still exercised, and the freeze is still up for long enough that the
  # background-writer probe gets hundreds of samples inside it.
  tenancy:
    promotion:
      drain: PT0.2S
    # How long a process remembers which schema an organization lives in. Thirty seconds in production;
    # here it is also how long every promotion sleeps after the flip so other processes drop the old
    # route before the source rows go (TenantPromoter.waitForEveryProcessToSeeTheFlip), and twelve
    # promote/demote calls at the production value would put SIX MINUTES of sleep into a nine-minute
    # suite. Shortened, not removed — the wait is still taken and the memo still expires on exactly
    # this number, so both halves of the mechanism are exercised. Low enough that a stale route is
    # gone before any assertion looks; high enough that the cache is a cache and the router is not
    # re-reading the registry on every borrow of the whole suite.
    route-ttl: PT2S
  # No Keycloak in unit/IT context by default — the org dev-bootstrap runner must not fire.
  organization:
    dev-bootstrap:
      enabled: false
  # Outbox retry sweep off: its five-minute cron would otherwise fire from every cached context
  # against the one shared registry, resubmitting publications other tests left incomplete while
  # those tests assert on them. OutboxResubmissionJobIntegrationTest drives resubmitOnce() directly —
  # the entry point that carries neither the flag nor the ShedLock.
  events:
    resubmission:
      enabled: false
  # Exchange worker is driven explicitly by tests via drainOnce() — no background claims racing asserts.
  exchange:
    worker-auto-start: false
    retry-base-backoff: PT0S   # release-then-reclaim tests re-drain immediately
    schedule-fire-enabled: false  # tests drive fireDueSchedules() directly; a minute-cadence
                                  # background trigger would race them from every cached context
  # Webhook worker is driven explicitly by tests; receivers run on localhost so private hosts are allowed.
  webhooks:
    worker-auto-start: false
    allow-private-hosts: true
    retry-base-backoff: PT0.1S
  # Delivery worker is driven explicitly by tests (deterministic, no cross-context background polling).
  notification:
    # Test webhook receivers run on localhost — the SSRF guard must not block them here.
    webhook-allow-private-hosts: true
    delivery:
      worker-auto-start: false
      retry-base-backoff: PT0.1S


management:
  otlp:
    metrics:
      export:
        enabled: false
    tracing:
      export:
        enabled: false
    logging:
      export:
        enabled: false
