spring:
  application:
    name: enterprise-modulith-template
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      # Boot's default max-file-size is 1MB, which 413'd any real upload before the handler ran and
      # left the files module's 5MB multipart branch unreachable over HTTP. Keep this above that
      # threshold so the multipart path stays live.
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:25MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:26MB}
  security:
    oauth2:
      resourceserver:
        # Tokens must be minted FOR this API (smsone-web carries the smsone-api-audience scope);
        # without this, any token from the realm — e.g. the smsone-admin service account, whose
        # realm-management roles must never reach this API — would authenticate here.
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/smsone}
          audiences: ${KEYCLOAK_EXPECTED_AUDIENCE:smsone-api}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:modulith}
    username: ${POSTGRES_USER:modulith}
    # Dev default matches the Compose stack; ALWAYS override in production.
    password: ${POSTGRES_PASSWORD:modulith}
    hikari:
      # Keep pool >= notification delivery concurrency so fan-out status writes don't starve
      # request-serving traffic. Raise both together (and Postgres max_connections) to scale out.
      maximum-pool-size: ${DB_POOL_SIZE:16}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}
      # Tight timeouts are what make "degrade to L1-only" real — Lettuce's default command
      # timeout is 60s, which would stall every cache call during a Valkey outage.
      timeout: ${VALKEY_TIMEOUT:2s}
      connect-timeout: ${VALKEY_CONNECT_TIMEOUT:2s}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          # Timeouts (ms) well below app.notification.delivery.stale-lock — JavaMail defaults to
          # infinite, which would let a hung SMTP host pin a delivery worker permit forever.
          connectiontimeout: ${SMTP_CONNECT_TIMEOUT_MS:5000}
          timeout: ${SMTP_READ_TIMEOUT_MS:5000}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MS:5000}
  modulith:
    events:
      republish-outstanding-events-on-restart: true
  docker:
    compose:
      file: docker/docker-compose.yml

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # Our cursor parameters are named page[size] / page[after] (ADR 0002). RFC 3986 reserves [ and ]
    # for IPv6 literals in the HOST, and Tomcat enforces that across the whole URI, so an unencoded
    # bracket is rejected by the connector's parser — before any filter, which means a raw Tomcat HTML
    # 400 rather than our envelope, and nothing in the application can catch it. Clients that do not
    # percent-encode (Postman among them) would hit that on every paginated call.
    # Publishing a parameter name the server refuses to parse is not a contract; allowing the two
    # characters is. They carry no meaning in a query string, so nothing is relaxed but the spelling.
    relaxed-query-chars: "[,]"
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

app:
  keycloak-admin:
    base-url: ${KEYCLOAK_URL:http://localhost:8081}
    realm: ${KEYCLOAK_REALM:smsone}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:smsone-admin}
    # Dev default matches the shipped realm's smsone-admin secret; ALWAYS override in production.
    client-secret: ${KEYCLOAK_ADMIN_SECRET:smsone-admin-secret}
  provisioning:
    gate-enabled: ${PROVISIONING_GATE_ENABLED:true}          # no-JIT: a valid JWT is not access
    invite-lifespan: ${PROVISIONING_INVITE_LIFESPAN:PT12H}
    redirect-uri: ${PROVISIONING_REDIRECT_URI:}
    app-client-id: ${PROVISIONING_APP_CLIENT:smsone-web}
    # Baseline realm role every provisioned account gets (blank grants none). Authority in this app
    # comes from platform roles and org permissions, never from this one — and a platform role here is
    # rejected at startup, since invite is reachable by any org member holding member:invite.
    default-realm-role: ${PROVISIONING_DEFAULT_REALM_ROLE:USER}
  identity:
    dev-bootstrap:
      # Off by default. When on, projects the local app_user row for an EXISTING Keycloak account so a
      # realm-imported platform admin passes the no-JIT gate without owning an org. Never creates the
      # Keycloak account. Idempotent; needs Keycloak reachable.
      enabled: ${IDENTITY_DEV_BOOTSTRAP_ENABLED:false}
      email: ${IDENTITY_DEV_BOOTSTRAP_EMAIL:ayesigapo@gmail.com}
    reconciliation:
      # Keycloak is the system of record; app_user is a projection, and nothing pushes deletions to it.
      # Without this pull a deleted account lingers as an ACTIVE-looking row forever. Access is never at
      # risk from the lag (no-JIT means a deleted account cannot mint a token whatever this table says)
      # — the job corrects the RECORD.
      enabled: ${IDENTITY_RECONCILIATION_ENABLED:true}
      # REPORT ships as the default deliberately: this is the only scheduled job that can revoke access,
      # and a fork should watch what it WOULD have done before letting it act. Switch to DISABLE once the
      # nightly log reads the way you expect.
      action: ${IDENTITY_RECONCILIATION_ACTION:REPORT}
      # Ignore accounts young enough to still be mid-provisioning, so a half-finished retry is not raced.
      grace-period: ${IDENTITY_RECONCILIATION_GRACE:PT1H}
      # Misconfiguration circuit breaker. One account gone is attrition; a tenth of them gone at once is
      # a wrong realm, a wrong base URL, or a service account that lost view-users — and every one of
      # those answers 404 per row. Above the cap the job changes NOTHING and logs an error.
      max-orphan-ratio: ${IDENTITY_RECONCILIATION_MAX_ORPHAN_RATIO:0.10}
      batch-size: ${IDENTITY_RECONCILIATION_BATCH_SIZE:500}
  impersonation:
    # The only sanctioned path from the platform axis to tenant data, and the only one that leaves a
    # trail. Off means REFUSED, not absent: the routes and the X-Impersonate header both answer 403
    # naming this switch. A 404 would look like a typo'd path, and ignoring the header is worse still —
    # the request would succeed as the operator while they believed they were wearing the target.
    enabled: ${IMPERSONATION_ENABLED:true}
    # Minutes, not hours: a session covers one investigation, not standing access to an account. An
    # over-cap request is rejected rather than clamped — see ImpersonationProperties for why.
    default-ttl: ${IMPERSONATION_DEFAULT_TTL:PT15M}
    max-ttl: ${IMPERSONATION_MAX_TTL:PT30M}
  organization:
    dev-bootstrap:
      # Off by default. When on, seeds a Keycloak org + local projection with an OWNER at startup so
      # org RBAC is exercisable out of the box (docker/dev). Idempotent; needs Keycloak reachable.
      enabled: ${ORG_DEV_BOOTSTRAP_ENABLED:false}
      alias: ${ORG_DEV_BOOTSTRAP_ALIAS:acme}
      name: ${ORG_DEV_BOOTSTRAP_NAME:Acme}
      owner-email: ${ORG_DEV_BOOTSTRAP_OWNER_EMAIL:ayesigapo@gmail.com}
      owner-first-name: ${ORG_DEV_BOOTSTRAP_OWNER_FIRST:Paul}
      owner-last-name: ${ORG_DEV_BOOTSTRAP_OWNER_LAST:Ayesiga}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    key-prefix: rl
    # TENANT tiers key by the caller's active org (Keycloak 'organization' claim). This flat claim is a
    # fallback for non-org IdPs; if neither is present, keying falls back to sub then IP.
    tenant-claim: ${RATE_LIMIT_TENANT_CLAIM:tenant}
    backend-timeout: ${RATE_LIMIT_BACKEND_TIMEOUT:PT0.25S}
    trust-forwarded-for: ${RATE_LIMIT_TRUST_XFF:false} # only true behind a trusted proxy/gateway
    tiers:
      - id: write
        path-pattern: /api/**
        methods: [POST, PUT, PATCH, DELETE]
        scope: TENANT
        capacity: ${RATE_LIMIT_WRITE_CAPACITY:60}
        refill-period: PT1M
      - id: read
        path-pattern: /api/**
        methods: [GET]
        scope: TENANT
        capacity: ${RATE_LIMIT_READ_CAPACITY:600}
        refill-period: PT1M
    default-tier:
      id: default
      scope: PRINCIPAL
      capacity: 300
      refill-period: PT1M
  webhooks:
    worker-auto-start: ${WEBHOOKS_WORKER_AUTOSTART:true}
    batch-size: ${WEBHOOKS_BATCH_SIZE:50}
    poll-interval: ${WEBHOOKS_POLL_INTERVAL:PT5S}
    stale-lock: ${WEBHOOKS_STALE_LOCK:PT2M}
    max-attempts: ${WEBHOOKS_MAX_ATTEMPTS:5}
    retry-base-backoff: ${WEBHOOKS_RETRY_BASE:PT10S}
    retry-max-backoff: ${WEBHOOKS_RETRY_MAX:PT1H}
    timeout-seconds: ${WEBHOOKS_TIMEOUT:5}
    allow-private-hosts: ${WEBHOOKS_ALLOW_PRIVATE_HOSTS:false} # only true behind a trusted egress boundary
    # The delivery log is a log, not an archive: terminal rows (DELIVERED and FAILED) past this are
    # purged nightly. A dead-letter older than the window is stale noise nobody is coming back for.
    retention: ${WEBHOOKS_RETENTION:P30D}
  notification:
    from: ${NOTIFICATION_FROM:no-reply@smsone.co.ug}
    slack-webhook-url: ${NOTIFICATION_SLACK_WEBHOOK:}
    webhook-timeout-seconds: ${NOTIFICATION_WEBHOOK_TIMEOUT:5}
    # Async fan-out worker (durable delivery queue).
    delivery:
      batch-size: ${NOTIFICATION_BATCH_SIZE:200}
      concurrency: ${NOTIFICATION_CONCURRENCY:16}
      max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:5}
      poll-interval: ${NOTIFICATION_POLL_INTERVAL:PT1S}
      retry-base-backoff: ${NOTIFICATION_RETRY_BASE:PT10S}
      retry-max-backoff: ${NOTIFICATION_RETRY_MAX:PT10M}
      stale-lock: ${NOTIFICATION_STALE_LOCK:PT5M}
      # Terminal rows (SENT + FAILED) past this are purged by the nightly retention job.
      retention: ${NOTIFICATION_RETENTION:P7D}
      max-drain-batches: ${NOTIFICATION_MAX_DRAIN:25}
      throttle-delay: ${NOTIFICATION_THROTTLE_DELAY:PT1S}     # how long to defer a delivery its channel rate throttled
      throttle-max-age: ${NOTIFICATION_THROTTLE_MAX_AGE:PT1H} # dead-letter if throttled longer than this (mis-set-rate guard)
      # Per-channel outbound provider limits (cluster-wide via Valkey). Unset = unlimited. Example:
      # rate:
      #   EMAIL: {capacity: 200, period: PT1S}
      #   SMS:   {capacity: 10,  period: PT1S}
    admins:
      # In-app targeting resolves the admin's Keycloak subject from this email (identity module) —
      # the default matches the shipped dev realm's admin user so in-app delivery works out of the box.
      - email: ${NOTIFICATION_ADMIN_EMAIL:ayesigapo@gmail.com}
  localization:
    # The fallback chain's floor: exact tag -> language -> THIS -> the key itself. An unparseable
    # tag fails at startup, not at first resolve.
    default-locale: ${LOCALIZATION_DEFAULT_LOCALE:en}
  analytics:
    database-path: ${ANALYTICS_DB_PATH:data/analytics.duckdb}
    snapshot-dir: ${ANALYTICS_SNAPSHOT_DIR:data/snapshots}
    threads: ${ANALYTICS_THREADS:2}
    memory-limit: ${ANALYTICS_MEMORY_LIMIT:512MB}
  persistence:
    soft-delete:
      # Nightly retention purge for soft-deleted aggregates (the seven AggregateRoot tables). Past this
      # window the rows are HARD deleted and no longer restorable — that is the point: it is what makes
      # an erasure request actually erase. audit_log is never in scope (append-only by design).
      # Batches bound one transaction; max-batches bounds one run, so a huge backlog drains over several
      # nights instead of overrunning the job's ShedLock lease.
      purge-enabled: ${SOFT_DELETE_PURGE_ENABLED:true}
      retention: ${SOFT_DELETE_RETENTION:P30D}
      batch-size: ${SOFT_DELETE_PURGE_BATCH_SIZE:500}
      max-batches: ${SOFT_DELETE_PURGE_MAX_BATCHES:100}
  idempotency:
    # Claim-first store (ADR 0005). The lease is how long an in-progress claim blocks duplicates
    # before a crashed instance's claim is taken over; retention is how long a completed response
    # stays replayable before the nightly purge. The body cap bounds what is hashed AND stored —
    # an oversized request creates no row at all.
    in-progress-lease: ${IDEMPOTENCY_LEASE:PT5M}
    max-body-bytes: ${IDEMPOTENCY_MAX_BODY_BYTES:262144}
    retention: ${IDEMPOTENCY_RETENTION:P1D}
  scheduler:
    # Completed event publications stay inspectable for a week, then the nightly purge removes them.
    event-retention: ${SCHEDULER_EVENT_RETENTION:P7D}
    # Inbox rows only matter while a publication could still be redelivered; comfortably above
    # event-retention so a publication completed late still dedupes its restart redelivery.
    event-inbox-retention: ${SCHEDULER_EVENT_INBOX_RETENTION:P14D}
  cache:
    l1-ttl: ${CACHE_L1_TTL:PT60S}
    l1-max-size: ${CACHE_L1_MAX_SIZE:10000}
    l2-ttl: ${CACHE_L2_TTL:PT10M}
    l2-enabled: ${CACHE_L2_ENABLED:true}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:8333}
    region: ${S3_REGION:us-east-1}
    # Dev defaults match docker/seaweedfs/s3-config.json; ALWAYS override in production.
    access-key: ${S3_ACCESS_KEY:smsone}
    secret-key: ${S3_SECRET_KEY:smsone-secret}
    bucket: ${S3_BUCKET:smsone}
    bootstrap-bucket: ${S3_BOOTSTRAP_BUCKET:true}
    # Remote timeouts are mandatory (AGENTS §7). The Apache client's defaults would let a stalled
    # endpoint hold a request thread ~30s per attempt, and the storage breaker counts only thrown
    # failures — slow-but-completing calls never open it. api-call bounds one whole SDK operation
    # (multipart parts are separate operations, so large uploads are not squeezed by it).
    connect-timeout: ${S3_CONNECT_TIMEOUT:PT2S}
    socket-timeout: ${S3_SOCKET_TIMEOUT:PT10S}
    api-call-timeout: ${S3_API_CALL_TIMEOUT:PT30S}

resilience4j:
  circuitbreaker:
    instances:
      storage:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: ${STORAGE_BREAKER_WAIT:PT10S}
        ignore-exceptions:
          - ug.co.smsone.files.FileNotFoundException   # business not-found never trips the breaker

springdoc:
  paths-to-exclude: /test/**   # test-classpath contract endpoints must never reach the spec

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
