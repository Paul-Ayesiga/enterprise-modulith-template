spring:
  application:
    name: gateway-test

server:
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gatewayroutes,gatewaycatalog,gatewayopenapi,gatewayusage,gatewayblocklist

# One backend stub (its uri + the JWKS uri are set per-run to the test server's random port), plus
# routes for the predicate tests (Phase 1) and the auth-policy tests (Phase 2).
gateway:
  security:
    jwk-set-uri: "${jwks.uri:http://localhost:1/jwks}"   # SecurityTest points this at the stub's JWKS
    tenant-claim: tenant
    # Auto-blocking OFF in the shared test baseline — the abuse guard would otherwise trip on the
    # many deliberate 401/403s the auth tests fire. AutoBlockTest opts back in with its own Valkey.
    blocklist:
      auto:
        enabled: false
      persistent:
        enabled: false
    cors:
      allowed-origins:
        - http://example.com
    internal-tokens:
      - name: reporting
        token: internal-secret-1
        scopes: [api, reports]
      - name: limited
        token: internal-secret-2
        scopes: [reports]
  traffic:
    rate-limit:
      replenish-rate: 1     # deliberately tiny so a rapid burst trips 429 deterministically
      burst-capacity: 2
  policies:
    open-headers:                             # a reusable transform-only policy
      transform:
        set-response-headers:
          X-Policy: open
    must-auth:                                # a reusable auth policy
      auth:
        authenticated: true
  products:
    sms-api:
      name: SMS API
      description: Send and manage messages
  services:
    - id: backend
      uri: "${backend.uri:http://localhost:1}"
      health-path: /health
    - id: lb-backend                          # two instances → the edge load-balances across them
      instances:
        - "${lb.a.uri:http://localhost:1}"
        - "${lb.b.uri:http://localhost:1}"
      health-path: /health
  routes:
    - id: by-path
      order: 0
      service-id: backend
      product: sms-api
      predicates:
        - kind: PATH
          args: [/path-route/**]
    - id: by-host
      order: 1
      service-id: backend
      predicates:
        - kind: HOST
          args: ["**.byhost.local"]
    - id: by-header
      order: 2
      service-id: backend
      predicates:
        - kind: HEADER
          args: [X-Route, header-match]
    - id: by-method
      order: 3
      service-id: backend
      predicates:
        - kind: METHOD
          args: [DELETE]
    - id: by-query
      order: 4
      service-id: backend
      predicates:
        - kind: QUERY
          args: [flag, "on"]
    - id: sec-open
      order: 10
      service-id: backend
      predicates:
        - kind: PATH
          args: [/open/**]
    - id: sec-authenticated
      order: 11
      service-id: backend
      predicates:
        - kind: PATH
          args: [/secured/**]
      auth:
        authenticated: true
    - id: sec-scoped
      order: 12
      service-id: backend
      predicates:
        - kind: PATH
          args: [/scoped/**]
      auth:
        authenticated: true
        scopes: [api]
    - id: sec-tenant
      order: 13
      service-id: backend
      predicates:
        - kind: PATH
          args: [/tenant/orgs/**]
      auth:
        authenticated: true
        tenant-path-template: /tenant/orgs/{tenant}/**
    - id: rl-route
      order: 20
      service-id: backend
      predicates:
        - kind: PATH
          args: [/rl/**]
      traffic:
        rate-limited: true
    - id: slow-route
      order: 21
      service-id: backend
      predicates:
        - kind: PATH
          args: [/slow/**]
      traffic:
        response-timeout-ms: 300
    - id: size-route
      order: 22
      service-id: backend
      predicates:
        - kind: PATH
          args: [/size/**]
      traffic:
        max-request-bytes: 100
    - id: cb-route
      order: 23
      service-id: backend
      predicates:
        - kind: PATH
          args: [/cb/**]
      traffic:
        circuit-breaker: true
    - id: retry-route
      order: 24
      service-id: backend
      predicates:
        - kind: PATH
          args: [/retry/**]
      traffic:
        retries: 2
    - id: lb-route
      order: 25
      service-id: lb-backend
      predicates:
        - kind: PATH
          args: [/lb/**]
    - id: cache-route
      order: 26
      service-id: backend
      predicates:
        - kind: PATH
          args: [/cache/**]
      auth:                                   # authenticated → the edge stamps X-Tenant-Id (cache key)
        authenticated: true
      traffic:
        cache-ttl-seconds: 60
    - id: transform-route
      order: 27
      service-id: backend
      predicates:
        - kind: PATH
          args: [/xform/**]
      transform:
        strip-prefix: 1                       # /xform/foo -> /foo upstream
        set-request-headers:
          X-Tenant-Injected: acme
        remove-request-headers: [Authorization]
        add-request-params:
          source: edge
        set-response-headers:
          X-Frame-Options: DENY
        remove-response-headers: [X-Backend-Secret]
    - id: ws-route
      order: 28
      service-id: backend
      predicates:
        - kind: PATH
          args: [/ws/**]
    - id: quota-route
      order: 29
      service-id: backend
      predicates:
        - kind: PATH
          args: [/quota/**]
    - id: disc-route                          # targets a service that arrives via discovery, not config
      order: 40
      service-id: discovered-svc
      predicates:
        - kind: PATH
          args: [/disc/**]
    - id: deprecated-route
      order: 41
      service-id: backend
      predicates:
        - kind: PATH
          args: [/dep/**]
      lifecycle:
        status: deprecated
        sunset: "Wed, 31 Dec 2025 23:59:59 GMT"
    - id: retired-route
      order: 42
      service-id: backend
      predicates:
        - kind: PATH
          args: [/gone/**]
      lifecycle:
        status: retired
        sunset: "Sun, 30 Jun 2024 23:59:59 GMT"
    - id: v1-route                            # versioning by header; v1 is deprecated
      order: 43
      service-id: backend
      predicates:
        - kind: PATH
          args: [/versioned/**]
        - kind: HEADER
          args: [X-API-Version, v1]
      lifecycle:
        status: deprecated
    - id: v2-route                            # v2 is the current version
      order: 44
      service-id: backend
      predicates:
        - kind: PATH
          args: [/versioned/**]
        - kind: HEADER
          args: [X-API-Version, v2]
    - id: pa-route                            # shares the named open-headers policy
      order: 30
      service-id: backend
      predicates:
        - kind: PATH
          args: [/pa/**]
      policy-ref: open-headers
    - id: pb-route                            # same named policy, different route
      order: 31
      service-id: backend
      predicates:
        - kind: PATH
          args: [/pb/**]
      policy-ref: open-headers
    - id: pc-route                            # references the named auth policy
      order: 32
      service-id: backend
      predicates:
        - kind: PATH
          args: [/pc/**]
      policy-ref: must-auth
    - id: pd-route                            # references must-auth but overrides auth inline → open
      order: 33
      service-id: backend
      predicates:
        - kind: PATH
          args: [/pd/**]
      policy-ref: must-auth
      auth:
        authenticated: false
