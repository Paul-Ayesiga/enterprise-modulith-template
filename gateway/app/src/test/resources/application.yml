spring:
  application:
    name: gateway-test

# One backend (its uri is overridden per-test with the stub's random port), and one route per
# predicate kind so RoutingTest can prove each maps onto the runtime.
gateway:
  services:
    - id: backend
      uri: "${backend.uri:http://localhost:1}"   # backend.uri is set per-run by @DynamicPropertySource
      health-path: /health
  routes:
    - id: by-path
      order: 0
      service-id: backend
      predicates:
        - kind: PATH
          args: [/path-route/**]
    - id: by-host
      order: 1
      service-id: backend
      predicates:
        - kind: HOST
          args: ["**.byhost.local"]
    - id: by-header
      order: 2
      service-id: backend
      predicates:
        - kind: HEADER
          args: [X-Route, header-match]
    - id: by-method
      order: 3
      service-id: backend
      predicates:
        - kind: METHOD
          args: [DELETE]
    - id: by-query
      order: 4
      service-id: backend
      predicates:
        - kind: QUERY
          args: [flag, "on"]
