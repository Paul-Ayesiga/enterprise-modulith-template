spring:
  application:
    name: gateway-test

# One backend stub (its uri + the JWKS uri are set per-run to the test server's random port), plus
# routes for the predicate tests (Phase 1) and the auth-policy tests (Phase 2).
gateway:
  security:
    jwk-set-uri: "${jwks.uri:http://localhost:1/jwks}"   # SecurityTest points this at the stub's JWKS
    tenant-claim: tenant
    cors:
      allowed-origins:
        - http://example.com
    internal-tokens:
      - name: reporting
        token: internal-secret-1
        scopes: [api, reports]
      - name: limited
        token: internal-secret-2
        scopes: [reports]
  traffic:
    rate-limit:
      replenish-rate: 1     # deliberately tiny so a rapid burst trips 429 deterministically
      burst-capacity: 2
  services:
    - id: backend
      uri: "${backend.uri:http://localhost:1}"
      health-path: /health
  routes:
    - id: by-path
      order: 0
      service-id: backend
      predicates:
        - kind: PATH
          args: [/path-route/**]
    - id: by-host
      order: 1
      service-id: backend
      predicates:
        - kind: HOST
          args: ["**.byhost.local"]
    - id: by-header
      order: 2
      service-id: backend
      predicates:
        - kind: HEADER
          args: [X-Route, header-match]
    - id: by-method
      order: 3
      service-id: backend
      predicates:
        - kind: METHOD
          args: [DELETE]
    - id: by-query
      order: 4
      service-id: backend
      predicates:
        - kind: QUERY
          args: [flag, "on"]
    - id: sec-open
      order: 10
      service-id: backend
      predicates:
        - kind: PATH
          args: [/open/**]
    - id: sec-authenticated
      order: 11
      service-id: backend
      predicates:
        - kind: PATH
          args: [/secured/**]
      auth:
        authenticated: true
    - id: sec-scoped
      order: 12
      service-id: backend
      predicates:
        - kind: PATH
          args: [/scoped/**]
      auth:
        authenticated: true
        scopes: [api]
    - id: sec-tenant
      order: 13
      service-id: backend
      predicates:
        - kind: PATH
          args: [/tenant/orgs/**]
      auth:
        authenticated: true
        tenant-path-template: /tenant/orgs/{tenant}/**
    - id: rl-route
      order: 20
      service-id: backend
      predicates:
        - kind: PATH
          args: [/rl/**]
      traffic:
        rate-limited: true
    - id: slow-route
      order: 21
      service-id: backend
      predicates:
        - kind: PATH
          args: [/slow/**]
      traffic:
        response-timeout-ms: 300
    - id: size-route
      order: 22
      service-id: backend
      predicates:
        - kind: PATH
          args: [/size/**]
      traffic:
        max-request-bytes: 100
