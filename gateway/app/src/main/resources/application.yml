spring:
  application:
    name: gateway
  data:
    redis:                              # Valkey — the rate limiter's shared token-bucket store
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}

server:
  port: ${GATEWAY_PORT:8090}
  # Compress proxied responses the client will accept (gzip), above a min size and for text-like types.
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/plain,text/css,application/javascript
    min-response-size: 1024

management:
  # Bind the management/admin endpoints to a SEPARATE port (and ideally a private network) from public
  # traffic — set management.server.port so the admin API (gatewayroutes) is unreachable from the edge.
  server:
    port: ${GATEWAY_ADMIN_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gatewayroutes   # gatewayroutes = the route-admin API

# The route/service catalog (config-driven). Today the gateway fronts one backend — the modulith;
# add services and routes here as the platform splits into more.
gateway:
  # Edge security: validate bearer JWTs against the IdP's JWKS (no platform call), and which claim
  # carries the tenant. CORS is off by default — set gateway.security.cors.allowed-origins per deploy.
  security:
    jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:8081/realms/smsone/protocol/openid-connect/certs}
    tenant-claim: ${GATEWAY_TENANT_CLAIM:tenant}
  # The platform seam: resolve an X-Api-Key by calling the modulith's introspection endpoint with the
  # shared secret. Unset the uri to turn API-key auth off (the bearer path still works).
  platform:
    introspection:
      uri: ${GATEWAY_INTROSPECTION_URI:http://localhost:8080/internal/gateway/api-key/introspect}
      secret: ${GATEWAY_INTROSPECTION_SECRET:dev-gateway-secret}
    # Publish edge audit events (access denials) to the platform. Unset the uri to turn edge auditing
    # off (denials are still recorded in the local gateway.security log).
    audit:
      uri: ${GATEWAY_AUDIT_URI:http://localhost:8080/internal/gateway/audit}
      secret: ${GATEWAY_AUDIT_SECRET:dev-gateway-secret}
    # Enforce each consumer's plan quota, fetched from the platform's subscription entitlements. Unset
    # the uri to turn quota enforcement off.
    quota:
      uri: ${GATEWAY_QUOTA_URI:http://localhost:8080/internal/gateway/quota}
      secret: ${GATEWAY_QUOTA_SECRET:dev-gateway-secret}
  # Traffic management: the shared token-bucket rate (per caller — principal, else tenant, else IP),
  # the default for any route with rate-limited:true.
  traffic:
    rate-limit:
      replenish-rate: ${GATEWAY_RATE_REPLENISH:20}    # tokens/sec
      burst-capacity: ${GATEWAY_RATE_BURST:40}
  services:
    - id: modulith
      uri: ${MODULITH_URI:http://localhost:8080}
      health-path: /actuator/health
  routes:
    - id: modulith-api
      order: 0
      service-id: modulith
      predicates:
        - kind: PATH
          args:
            - /api/v1/**
      # The API requires a valid token at the edge; the modulith still runs its own fine-grained checks.
      auth:
        authenticated: true
      # Protect the backend: fail a slow response fast, cap the body, rate-limit per caller.
      traffic:
        response-timeout-ms: 15000
        max-request-bytes: 10485760   # 10 MB
        rate-limited: true

logging:
  # Separable observability streams — route each to its own appender/file in your logback config.
  level:
    gateway.access: INFO      # one line per request (method, path, status, latency, ids, tenant)
    gateway.security: INFO    # authN/authZ decisions (edge_auth_denied ...)
    gateway.error: WARN       # upstream faults (gateway_fault ...)
