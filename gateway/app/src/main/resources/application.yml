spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            # Fail fast when a backend won't accept the TCP connection (ms). There was no connect
            # timeout before — only the per-route response timeout — so a black-holed backend hung on
            # the reactor-netty default. Pure upside on any topology, single- or multi-instance.
            connect-timeout: 2000
    loadbalancer:
      # Consumed by the health-checked instance supplier (active under the `multi` profile): SCLB probes
      # each instance's health path and balances only over instances that answer UP, ejecting a crashed
      # one from rotation. Harmless when no load-balanced service is configured.
      health-check:
        initial-delay: 2s
        interval: 5s
        path:
          default: /actuator/health
  data:
    redis:                              # Valkey — the rate limiter's shared token-bucket store
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}

server:
  port: ${GATEWAY_PORT:8090}
  # MUST stay `none`, and must be explicit. Left unset, Spring Boot picks the strategy from the detected
  # cloud platform, and on Kubernetes that turns on forwarded-header handling — which rewrites
  # `getRemoteAddress()` from the client's own X-Forwarded-For. EdgeClientIp then reads a *spoofed* peer
  # while believing it is reading the socket, so with `trusted-proxy-hops: 0` (the default, meaning "trust
  # nothing, the socket decides") a caller could still pick its own identity by setting one header. Proven
  # against the deployed gateway: with 9.0.0.0/8 blocked, `X-Forwarded-For: 9.9.9.9` returned 403 while the
  # same request without the header was let through. That is blocklist evasion, spoofable per-IP rate
  # limits, and an auto-block that can be aimed at somebody else's address.
  #
  # The edge decides how far to trust X-Forwarded-For in ONE place — gateway.security.blocklist
  # .trusted-proxy-hops — and the framework must not quietly have an opinion of its own. Put a real proxy
  # in front? Raise trusted-proxy-hops to match its hop count; do not switch this on.
  forward-headers-strategy: none
  # Compress proxied responses the client will accept (gzip), above a min size and for text-like types.
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/plain,text/css,application/javascript
    min-response-size: 1024

management:
  # Bind the management/admin endpoints to a SEPARATE port (and ideally a private network) from public
  # traffic — set management.server.port so the admin API (gatewayroutes) is unreachable from the edge.
  server:
    port: ${GATEWAY_ADMIN_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gatewayroutes,gatewaycatalog,gatewayopenapi,gatewayusage,gatewayblocklist   # route-admin + catalog/OpenAPI + usage + ip-blocklist

# The route/service catalog (config-driven). Today the gateway fronts one backend — the modulith;
# add services and routes here as the platform splits into more.
gateway:
  # Edge security: validate bearer JWTs against the IdP's JWKS (no platform call), and which claim
  # carries the tenant. CORS is off by default — set gateway.security.cors.allowed-origins per deploy.
  # UI-registered routes are runtime by default (re-seeded from YAML on restart). With this on, a
  # route registered with persist=true is stored in Valkey and re-applied on every boot (durable).
  persistent-routes:
    enabled: ${GATEWAY_PERSISTENT_ROUTES:true}

  security:
    jwk-set-uri: ${KEYCLOAK_JWKS:http://localhost:8081/realms/smsone/protocol/openid-connect/certs}
    tenant-claim: ${GATEWAY_TENANT_CLAIM:tenant}
    # Front-door deny-list, checked before ANY other policy (auth, quotas, routing). Entries here are
    # durable; runtime additions via the gatewayblocklist admin endpoint last until restart.
    # trusted-proxy-hops: 0 = gateway hit directly (X-Forwarded-For is client-writable and IGNORED);
    # 1 = behind one ingress that appends the real client address.
    blocklist:
      # Comma-separated CIDRs/IPs, e.g. "203.0.113.0/24,198.51.100.7". Empty = nothing blocked.
      cidrs: ${GATEWAY_BLOCKLIST:}
      # Trusted infra never blocked and never counted for abuse (health checkers, office, internal).
      allow: ${GATEWAY_ALLOWLIST:}
      trusted-proxy-hops: ${GATEWAY_TRUSTED_PROXY_HOPS:0}
      # Dynamic auto-blocking (fail2ban at the edge): a source earning `threshold` denied responses
      # of `statuses` within `window` is blocked for `block-duration`. Counted per source in Valkey
      # (shared across replicas). Conservative defaults; widen `statuses` to 429/404 to also catch
      # burst-abuse / scanning. Allowlisted sources are exempt.
      auto:
        enabled: ${GATEWAY_AUTOBLOCK:true}
        window: ${GATEWAY_AUTOBLOCK_WINDOW:PT1M}
        threshold: ${GATEWAY_AUTOBLOCK_THRESHOLD:20}
        block-duration: ${GATEWAY_AUTOBLOCK_DURATION:PT15M}
        statuses: ${GATEWAY_AUTOBLOCK_STATUSES:401,403}
      # Durable manual blocks added from the admin UI, backed by a Valkey set (survive restart).
      persistent:
        enabled: ${GATEWAY_PERSISTENT_BLOCKLIST:true}
  # The platform seam: resolve an X-Api-Key by calling the modulith's introspection endpoint with the
  # shared secret. Unset the uri to turn API-key auth off (the bearer path still works).
  platform:
    # One shared secret the gateway presents on every seam below — must match the modulith's
    # app.gateway.secret. ALWAYS override in production.
    secret: ${GATEWAY_SECRET:dev-gateway-secret}
    introspection:
      uri: ${GATEWAY_INTROSPECTION_URI:http://localhost:8080/internal/gateway/api-key/introspect}
    # Publish edge audit events (access denials) to the platform. Unset the uri to turn edge auditing
    # off (denials are still recorded in the local gateway.security log).
    audit:
      uri: ${GATEWAY_AUDIT_URI:http://localhost:8080/internal/gateway/audit}
    # Enforce each consumer's plan quota, fetched from the platform's subscription entitlements. Unset
    # the uri to turn quota enforcement off.
    quota:
      uri: ${GATEWAY_QUOTA_URI:http://localhost:8080/internal/gateway/quota}
    # Flush metered per-consumer request counts to the platform's usage ledger (metered billing).
    # Unset the uri to keep metering edge-local.
    usage-report:
      uri: ${GATEWAY_USAGE_URI:http://localhost:8080/internal/gateway/usage-report}
  # Traffic management: the shared token-bucket rate (per caller — principal, else tenant, else IP),
  # the default for any route with rate-limited:true.
  traffic:
    rate-limit:
      replenish-rate: ${GATEWAY_RATE_REPLENISH:20}    # tokens/sec
      burst-capacity: ${GATEWAY_RATE_BURST:40}
  # Named, reusable policies attached to routes by `policy-ref` (a route's own inline auth/traffic still
  # wins per aspect). `edge-api` is the shared API policy: a token at the edge + protect-the-backend limits.
  policies:
    edge-api:
      auth:
        # The API requires a valid token at the edge; the modulith still runs its own fine-grained checks.
        authenticated: true
      traffic:
        # Fail a slow backend fast, cap the body, rate-limit per caller (the shared token bucket above).
        response-timeout-ms: 15000
        max-request-bytes: 10485760   # 10 MB
        rate-limited: true
    # The MCP agent surface: authenticated like edge-api, but its own traffic shape — a tool call is
    # allowed a minute (agents poll async jobs rather than hold connections, but a single call may do
    # real work), and JSON-RPC requests are text (2 MiB is generous; bulk data moves by download URL).
    edge-mcp:
      auth:
        authenticated: true
      traffic:
        response-timeout-ms: 60000
        max-request-bytes: 2097152    # 2 MiB
        rate-limited: true
    # The pre-authentication surface. These callers cannot hold a token by nature — a prospect signing up
    # has no account yet, and Pesapal / Kill Bill are external systems that never see one — so demanding a
    # JWT here contradicted the modulith, which deliberately permits the very same paths. Before this
    # existed they fell through to the `platform-api` catch-all and every one of them answered 401.
    #
    # This is NOT authorization being dropped; it is moved to where the caller can actually be judged:
    # signup is feature-flagged and enumeration-safe, the Kill Bill hook compares a shared token in
    # constant time, and the Pesapal handlers only trigger a server-side re-query, so a forged ping is
    # inert. The traffic guards stay ON and get *tighter* — an unauthenticated path is precisely the one
    # that most needs a rate limit and the smallest body it can accept.
    edge-public:
      auth:
        authenticated: false
      traffic:
        response-timeout-ms: 15000
        max-request-bytes: 65536      # 64 KB — small JSON posts, never uploads
        rate-limited: true
  # API products — how the route surface is grouped for the developer portal / onboarding. A route joins
  # a product by its `product:` label; the name/description below are what the catalog (and portal) show.
  products:
    identity:
      name: Identity & Access
      description: The current user, the permission catalog, and platform-operator administration — users, impersonation, and search.
    organizations:
      name: Organizations
      description: Tenant lifecycle and org-scoped RBAC — members, roles, documents, search, audit, and webhooks under an organization.
    configuration:
      name: Configuration
      description: Platform settings, feature flags, and localized translations.
    content:
      name: Files & Documents
      description: Personal and organization file storage, and the document catalogs.
    notifications:
      name: Notifications
      description: The current user's in-app notification feed.
    audit:
      name: Audit
      description: The platform-wide audit trail.
    operations:
      name: Operations
      description: Operational surface — scheduler lock observability and the analytics report catalog.
    agents:
      name: Agents (MCP)
      description: The MCP agent surface — permission-gated tools over JSON-RPC at /mcp for AI agents holding org API keys.
    platform:
      name: Platform (catch-all)
      description: Any /api/v1 path not yet grouped into a product still routes to the backend here.
  services:
    - id: modulith
      uri: ${MODULITH_URI:http://localhost:8080}
      health-path: /actuator/health
  # One route per API product (all fronting the modulith today; they split cleanly when it does). Each
  # matches its product's path prefixes and shares the `edge-api` policy. A request takes the most specific
  # route by `order`; the `platform-api` catch-all (highest order) keeps any ungrouped path working.
  routes:
    # Public routes first. Order matters and is the whole bug: these paths are ordinary /api/v1/… strings,
    # so without a route of their own they were swallowed by the `platform-api` catch-all (order 100) and
    # its authenticated policy. Keep them below every other order.
    - id: signup-api
      order: 5
      service-id: modulith
      product: identity
      policy-ref: edge-public
      predicates:
        - kind: PATH
          args:
            # Mirrors the modulith's own permitAll list exactly — POST /signup, GET+POST /signup/verify.
            - /api/v1/signup
            - /api/v1/signup/verify
    - id: provider-callbacks
      order: 6
      service-id: modulith
      product: platform
      policy-ref: edge-public
      predicates:
        - kind: PATH
          args:
            - /api/v1/payments/pesapal/ipn
            - /api/v1/payments/pesapal/callback
            - /api/v1/billing/killbill/notifications
    - id: identity-api
      order: 10
      service-id: modulith
      product: identity
      policy-ref: edge-api
      predicates:
        - kind: PATH
          args:
            - /api/v1/me
            - /api/v1/permissions
            - /api/v1/admin/**
    - id: organizations-api
      order: 20
      service-id: modulith
      product: organizations
      policy-ref: edge-api
      predicates:
        - kind: PATH
          args:
            - /api/v1/orgs/**
    - id: configuration-api
      order: 30
      service-id: modulith
      product: configuration
      policy-ref: edge-api
      predicates:
        - kind: PATH
          args:
            - /api/v1/settings/**
            - /api/v1/feature-flags/**
            - /api/v1/translations/**
    - id: content-api
      order: 40
      service-id: modulith
      product: content
      policy-ref: edge-api
      predicates:
        - kind: PATH
          args:
            - /api/v1/files/**
            - /api/v1/documents/**
    - id: notifications-api
      order: 50
      service-id: modulith
      product: notifications
      policy-ref: edge-api
      predicates:
        - kind: PATH
          args:
            - /api/v1/notifications/**
    - id: audit-api
      order: 60
      service-id: modulith
      product: audit
      policy-ref: edge-api
      predicates:
        - kind: PATH
          args:
            - /api/v1/audit/**
    - id: operations-api
      order: 70
      service-id: modulith
      product: operations
      policy-ref: edge-api
      predicates:
        - kind: PATH
          args:
            - /api/v1/scheduler/**
            - /api/v1/analytics/**
    # The agent surface (MCP over stateless streamable HTTP). Its own policy, not edge-api: agent
    # tool calls may legitimately run longer than an interactive API call (edge-api's 15 s would cut
    # them off), while JSON-RPC bodies are small (2 MiB cap, not 10). Auth at the edge is the same
    # token-or-key check — the modulith re-checks per tool.
    - id: mcp-api
      order: 80
      service-id: modulith
      product: agents
      policy-ref: edge-mcp
      predicates:
        - kind: PATH
          args:
            - /mcp
            - /mcp/**
    - id: platform-api
      order: 100
      service-id: modulith
      product: platform
      policy-ref: edge-api
      predicates:
        - kind: PATH
          args:
            - /api/v1/**

logging:
  # Separable observability streams — route each to its own appender/file in your logback config.
  level:
    gateway.access: INFO      # one line per request (method, path, status, latency, ids, tenant)
    gateway.security: INFO    # authN/authZ decisions (edge_auth_denied ...)
    gateway.error: WARN       # upstream faults (gateway_fault ...)
